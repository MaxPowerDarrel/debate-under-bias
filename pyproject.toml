[project]
name = "debate-bias"
version = "0.1.0"
description = "Does debate protect a weak judge from a known, exploitable bias?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "matplotlib",
    "numpy",
    "pandas",
    "python-dotenv",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_bias"]

[tool.pytest.ini_options]
testpaths = ["tests"]
