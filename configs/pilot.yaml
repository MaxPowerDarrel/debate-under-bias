split: train
num_questions: 50
seed: 0
spending_cap_usd: 50
models:
  arguer: claude-sonnet-5-5
  judge: claude-haiku-5-5
effort:  # Pinned to each model's default so it is recorded, not implied
  arguer: high
  judge: medium
max_tokens:  # Includes thinking, which is billed by use, so a generous ceiling costs nothing extra
  arguer: 16000
  judge: 8000
prompts:  # Prompt versions: folders in prompts/
  judge: judge_v2
  debater: debater_v2
  consultant: consultant_v2
  judge_biased: judge_biased_v1  # judge_v2 plus the bias rule
  debater_informed: debater_informed_v1  # v2 plus the rule, told to the arguer
  consultant_informed: consultant_informed_v1
protocol:
  rounds: 3
  debate_words_per_turn: 150  # Hard limits, enforced by truncation and not stated in the prompt
  consultancy_words_per_turn: 300
  debate_target_words: 100  # What the prompt asks for, as in Khan et al.
  consultancy_target_words: 200
  judge_votes: 3
